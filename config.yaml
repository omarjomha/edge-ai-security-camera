source: 0                        # webcam index | video path | rtsp:// URL
detector_model: models/yolo11n.onnx
detector_conf: 0.5
face_det_model: models/scrfd_500m.onnx    # SCRFD-500M (from insightface buffalo_s)
face_embed_model: models/arcface_mbf.onnx # ArcFace, MobileFaceNet backbone (buffalo_s); next stage
face_conf: 0.5                  # SCRFD minimum face score
face_det_size: 320               # SCRFD input size; person crops are small, 640 is overkill
min_face_px: 40                  # skip faces too small to trust
similarity_threshold: 0.40       # placeholder: set from threshold sweep
grace_period_s: 5.0              # no friend match within this → INTRUDER
