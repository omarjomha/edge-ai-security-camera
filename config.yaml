source: 0                        # webcam index | video path | rtsp:// URL
detector_model: models/yolo11n.onnx
detector_conf: 0.1                       # low on purpose: the tracker also uses weak boxes
track_high_conf: 0.5                     # confident person box (also the cut-off for faces)
track_new_conf: 0.6                      # only boxes this confident start a new track
track_match_iou: 0.2                     # min overlap to link a track to a confident box
track_max_misses: 30                     # frames a lost track is kept (~2 s at 15 fps)
track_min_hits: 3                        # matched frames before a track gets an ID
face_det_model: models/scrfd_500m.onnx    # SCRFD-500M (from insightface buffalo_s)
face_embed_model: models/arcface_mbf.onnx # ArcFace, MobileFaceNet backbone (buffalo_s); next stage
face_conf: 0.5                  # SCRFD minimum face score
face_det_size: 320               # SCRFD input size; person crops are small, 640 is overkill
gallery_path: gallery/gallery.npz        # enrolled friend templates (gitignored)
enroll_min_photos: 2                     # good photos needed to enroll (prod: ~5+)
enroll_outlier_score: 0.5                # photo below this vs. its template is dropped
min_face_px: 40                  # skip faces too small to trust
similarity_threshold: 0.40       # placeholder: set from threshold sweep
grace_period_s: 5.0              # no friend match within this → INTRUDER
